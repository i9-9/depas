name: Buscar departamentos

on:
  schedule:
    # 5 corridas por día (hora Argentina = UTC-3): 08:17, 11:17, 14:17, 17:17, 20:17
    - cron: "17 11,14,17,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buscar-deptos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scraper.py

      - name: Guardar avisos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ web/data/ || true
          if git diff --cached --quiet; then
            echo "Sin cambios reales; no hay commit"
            exit 0
          fi
          git commit -m "Actualizar avisos"
          git pull --rebase origin HEAD
          git push
